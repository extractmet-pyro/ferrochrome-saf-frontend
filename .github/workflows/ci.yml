name: frontend-ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: dependency audit (report only)
        run: npm audit --omit=dev || true
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/ferrochrome-saf-backend", path: backend, token: "${{ secrets.BACKEND_REPO_TOKEN }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: pip install -r backend/requirements.txt
      - run: (cd backend && SPINUP_H=6 ALLOWED_ORIGINS=http://localhost:4173 uvicorn app.main:app --port 8000 &) && sleep 40
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
      - run: FECR_API=http://localhost:8000/api/v1 npm test && npx playwright test
