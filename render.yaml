# Render Blueprint for the FRONTEND repository (ferrochrome-saf-frontend) - static site.
services:
  - type: web
    name: fecr-twin-desk
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://fecr-twin-api.onrender.com/api/v1     # replace with your backend URL
      - key: VITE_WS_BASE_URL
        value: wss://fecr-twin-api.onrender.com/api/v1/ws/telemetry
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
